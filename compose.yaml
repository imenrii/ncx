services:
  ncx:
    build:
      context: .
    image: ncx-hub:local
    platform: linux/amd64
    # musl skips DNS search suffixes with Docker's ndots:0 default.
    dns_opt:
      - "ndots:${NCX_DNS_NDOTS:-1}"
    ports:
      - "${NCX_BIND_ADDRESS:?Set NCX_BIND_ADDRESS in .env}:${NCX_PORT:?Set NCX_PORT in .env}:8765"
    command:
      - hub
      - --listen
      - 0.0.0.0:8765
      - --base-path
      - /ncx
      - --local-root
      - /data
      - --session-limit
      - "10"
      - --session-ttl-seconds
      - "90"
      - --remote-ncx
      - /usr/local/bin/ncx
    volumes:
      - ncx-binary:/opt/ncx
      - type: bind
        source: "${NCX_DATA_ROOT:?Set NCX_DATA_ROOT in .env}"
        target: /data
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8765/ncx/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  ncx-binary:
