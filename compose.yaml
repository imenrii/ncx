services:
  ncx:
    build:
      context: .
    image: ncx-hub:local
    ports:
      - "127.0.0.1:${NCX_HOST_PORT:-8765}:8765"
    command:
      - hub
      - --listen
      - 0.0.0.0:8765
      - --base-path
      - /ncx
      - --local-root
      - /data
      - --session-limit
      - "${NCX_SESSION_LIMIT:-10}"
      - --session-ttl-seconds
      - "${NCX_SESSION_TTL_SECONDS:-90}"
    environment:
      HOME: /home/ncx
      NCX_REMOTE_NCX: /usr/local/bin/ncx
      NCX_SSH_PASSWORD: "${NCX_SSH_PASSWORD}"
    volumes:
      - type: bind
        source: "${NCX_DATA_ROOT}"
        target: /data
        read_only: true
      - type: bind
        source: "${NCX_KNOWN_HOSTS}"
        target: /home/ncx/.ssh/known_hosts
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "${NCX_MEMORY_LIMIT:-2g}"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8765/ncx/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
